<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Natural — Inventario de Productos</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-layout">
        <header id="app-header"></header>

        <div class="app-body">
            <aside id="app-sidebar"></aside>

            <main class="main-content">
                <section id="seccion-productos">
                    <header class="section-heading flex-between">
                        <div class="section-title-group">
                            <h2>Inventario de Productos</h2>
                            <a href="stock-bajo.html" class="btn btn-secondary">
                                Control de Stock Mínimo
                            </a>
                        </div>
                        <button id="btn-nuevo-producto" class="btn btn-primary" onclick="abrirModalProducto()">+ Registrar Nuevo Producto</button>
                    </header>

                    <div class="card">
                        <div class="search-bar">
                            <input type="text" id="filtro-productos" placeholder="Buscar producto por código o descripción" oninput="filtrarProductos()">
                        </div>

                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>
                                            <button type="button" class="th-filter-btn" id="th-btn-codigo" onclick="ordenarProductosPor('codigo')">
                                                Código <span class="th-filter-icon" id="th-icon-codigo">&#8693;</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button type="button" class="th-filter-btn" id="th-btn-descripcion" onclick="ordenarProductosPor('descripcion')">
                                                Descripción <span class="th-filter-icon" id="th-icon-descripcion">&#8693;</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button type="button" class="th-filter-btn" id="th-btn-categoria" onclick="ordenarProductosPor('categoria')">
                                                Categoría <span class="th-filter-icon" id="th-icon-categoria">&#8693;</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button type="button" class="th-filter-btn" id="th-btn-precioUnitario" onclick="ordenarProductosPor('precioUnitario')">
                                                Precio Unitario <span class="th-filter-icon" id="th-icon-precioUnitario">&#8693;</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button type="button" class="th-filter-btn" id="th-btn-stockActual" onclick="ordenarProductosPor('stockActual')">
                                                Stock Actual <span class="th-filter-icon" id="th-icon-stockActual">&#8693;</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button type="button" class="th-filter-btn" id="th-btn-stockMinimo" onclick="ordenarProductosPor('stockMinimo')">
                                                Stock Mínimo <span class="th-filter-icon" id="th-icon-stockMinimo">&#8693;</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button type="button" class="th-filter-btn" id="th-btn-activo" onclick="ordenarProductosPor('activo')">
                                                Estado <span class="th-filter-icon" id="th-icon-activo">&#8693;</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button type="button" class="th-filter-btn" id="th-btn-acciones" onclick="limpiarOrdenProductos()" title="Restablecer filtros y orden">
                                                Acciones
                                            </button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-productos">
                                    <tr><td colspan="8">Cargando productos...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- MODAL: REGISTRAR / MODIFICAR PRODUCTO -->
                <div id="modal-producto" class="modal-backdrop" style="display:none;">
                    <div class="modal-card">
                        <header class="modal-header">
                            <h3 id="modal-titulo">Registrar Producto</h3>
                            <button class="btn-close" onclick="cerrarModalProducto()">&times;</button>
                        </header>
                        <form id="form-producto" onsubmit="guardarProducto(event)">
                            <div class="form-group">
                                <label for="prod-codigo">Código Identificador</label>
                                <input type="text" id="prod-codigo" required placeholder="Ej: AV002">
                            </div>
                            <div class="form-group">
                                <label for="prod-desc">Descripción</label>
                                <input type="text" id="prod-desc" required placeholder="Ej: Avena instantánea 500g">
                            </div>
                            <div class="form-group">
                                <label for="prod-cat">Categoría</label>
                                <select id="prod-cat" required>
                                    <option value="CEREAL">Cereal</option>
                                    <option value="SEMILLA">Semilla</option>
                                    <option value="FRUTO_SECO">Fruto Seco</option>
                                    <option value="LEGUMBRE">Legumbre</option>
                                    <option value="SUPLEMENTO">Suplemento</option>
                                    <option value="OTRO">Otro</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="prod-precio">Precio Unitario ($)</label>
                                    <input type="number" id="prod-precio" step="0.01" min="0" required placeholder="0.00">
                                </div>
                                <div class="form-group">
                                    <label for="prod-stock-act">Stock Actual</label>
                                    <input type="number" id="prod-stock-act" min="0" step="1" required value="0">
                                </div>
                                <div class="form-group">
                                    <label for="prod-stock-min">Stock Mínimo Permitido</label>
                                    <input type="number" id="prod-stock-min" min="0" step="1" required value="0">
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" onclick="cerrarModalProducto()">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar Datos</button>
                            </div>
                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/productos.js"></script>
</body>
</html>
