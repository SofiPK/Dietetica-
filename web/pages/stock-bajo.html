<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Natural — Control de Stock Mínimo</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-layout">
        <header id="app-header"></header>

        <div class="app-body">
            <aside id="app-sidebar"></aside>

            <main class="main-content">
                <section id="seccion-stock-bajo">
                    <header class="section-heading flex-between">
                        <h2>Control de Stock Mínimo</h2>
                        <a href="productos.html" class="btn btn-secondary">
                            &larr; Volver a Inventario
                        </a>
                    </header>

                    <div class="card">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Código</th>
                                        <th>Descripción</th>
                                        <th>Categoría</th>
                                        <th>Stock Actual</th>
                                        <th>Stock Mínimo</th>
                                        <th>Diferencia con Mínimo</th>
                                        <th>Situación</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-stock-bajo">
                                    <tr><td colspan="7">Cargando reporte de stock...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/stock-bajo.js"></script>
</body>
</html>
